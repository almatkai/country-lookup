# Inactive review example. This is intentionally outside .github/workflows.
# It performs no upload, publication, release, installation or catalog mutation.
name: Country Lookup native verification example
on: workflow_dispatch
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-14, windows-2022]
        rust: [stable, '1.85.0']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
# Full source/renderer/package QA also requires Node, Python and openssl.
# YAML is review material, not evidence of any executed Windows/MSVC checks.
